# Site settings — the page is plain static HTML. Jekyll only needs to copy the
# published files; source artwork and build tooling are excluded below.
title: "Kevin Ostheimer - Cloud & AI Product Owner"
description: "Kevin Ostheimer - Cloud & AI Product Owner helping people deploy faster, scale reliably, and reduce costs with cloud-native AI solutions."
author: "Kevin Ostheimer"
url: "https://impulsleistung.de"

# CNAME is intentionally NOT excluded: GitHub Pages needs it for the custom
# domain. assets/logos is published; logos/ holds the untouched originals.
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - logos
  - tools
  - local
  - "*.py"
  - "*.pyc"

# Sitemap for the single static page. The HTML already carries its own
# canonical, Open Graph, Twitter and JSON-LD metadata, so no feed or
# SEO-tag plugin is needed.
plugins:
  - jekyll-sitemap
